# Runs `mise run check` when the author pushes. It deploys nothing; deployment is designed only in M6.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_USER: colony
          # A throwaway database that exists only for this CI job.
          POSTGRES_PASSWORD: colony-ci
          POSTGRES_DB: colony_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colony -d colony_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: test
      PUBLIC_URL: http://localhost:5173
      DATABASE_URL: postgres://colony:colony-ci@127.0.0.1:5432/colony_test?sslmode=disable
      TEST_DATABASE_URL: postgres://colony:colony-ci@127.0.0.1:5432/colony_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: mise run check
        run: mise run check
      - name: Generated code is committed and current
        run: git diff --exit-code

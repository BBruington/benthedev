# Alembic's CI: `mise run check` and the image Railway will build. It deploys nothing itself. Alembic's Biome
# config is its own root, so only the root mise.toml is listed beside the app's files.
name: alembic

on:
  push:
    paths:
      - apps/alembic/**
      - .github/workflows/alembic.yml
      - mise.toml
  pull_request:
    paths:
      - apps/alembic/**
      - .github/workflows/alembic.yml
      - mise.toml

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/alembic

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.1
          install: true
          cache: true
          working_directory: apps/alembic
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: mise run check
        run: mise run check
      # The build regenerates src/routeTree.gen.ts; generate needs a DATABASE_URL but never connects.
      - name: Migrations are generated
        run: bun run db:generate
        env:
          DATABASE_URL: postgres://ci@127.0.0.1/ci
      # Untracked files count too: a migration that was generated but never added would otherwise pass here.
      - name: Generated code is committed and current
        run: git diff --exit-code -- . && test -z "$(git status --porcelain -- .)" || { git status --porcelain -- .; exit 1; }

  test-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: alembic
          # A throwaway database that exists only for this CI job.
          POSTGRES_PASSWORD: alembic-ci
          POSTGRES_DB: alembic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alembic -d alembic_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://alembic:alembic-ci@127.0.0.1:5432/alembic_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.1
          install: true
          cache: true
          working_directory: apps/alembic
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: mise run test:db
        run: mise run test:db

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image Railway will build (root directory apps/alembic), so a Dockerfile mistake fails here, not in a deploy.
      - name: docker build (no push)
        run: docker build --tag alembic:ci .
